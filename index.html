<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Carga</title>
  
  <!-- Incluir fuentes de Google -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Enlace correcto al archivo CSS -->
  <link rel="stylesheet" href="../static/css/style_loading.css">
</head>
<body>
  <div class="loader-container">
    <!-- Enlace correcto a la imagen -->
    <img src="../static/imagenes/preloader.gif" alt="Cargando..." class="loader">
    
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>
    
    <p class="loading-percentage" id="loading-percentage">0%</p>
  </div>

  <!-- Enlace correcto al JS -->
  <script src="../static/js/loading.js"></script>

  <!-- Redirección al completar la carga -->
  <script>
    // Tiempo de espera para redirigir (en milisegundos)
    setTimeout(function() {
      window.location.href = "/portafolio_web/home/index.html";
    }, 3000);  // 3000 ms = 3 segundos
  </script>
</body>
</html>
